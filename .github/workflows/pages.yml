# Publishes the site to GitHub Pages on every push to main.
# Only the files listed below are published; anything else in the repo
# (design/, notes, etc.) is left out of the live site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p public
          cp index.html privacy.html 404.html public/
          cp robots.txt sitemap.xml site.webmanifest public/
          cp favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png public/
          cp og-image.png public/
          cp -r fonts public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
